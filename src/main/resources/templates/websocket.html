<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head(${pageTitle})}"></head>
<body>
<div th:replace="~{layout :: nav}"></div>

<main class="container mb-5">
    <h1 class="h3 mb-1">WebSocket Chat Sample</h1>
    <p class="text-muted">STOMP over SockJS endpoint: <code>/ws</code></p>

    <div class="row g-3">
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <div class="mb-2">
                        <label class="form-label">Your name</label>
                        <input id="sender" class="form-control" value="Guest"/>
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Message</label>
                        <input id="content" class="form-control" placeholder="Type a message"/>
                    </div>
                    <button id="btnConnect" type="button" class="btn btn-success">Connect</button>
                    <button id="btnSend" type="button" class="btn btn-primary" disabled>Send</button>
                </div>
            </div>
        </div>
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h2 class="h5">Messages</h2>
                    <ul id="messages" class="list-group list-group-flush border rounded" style="min-height: 260px;"></ul>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{layout :: scripts}"></div>
<script th:src="@{/webjars/sockjs-client/1.5.1/sockjs.min.js}"></script>
<script th:src="@{/webjars/stomp-websocket/2.3.4/stomp.min.js}"></script>
<script th:inline="javascript">
    const wsEndpoint = /*[[@{/ws}]]*/ '/ws';
    let stompClient = null;

    function appendMessage(text) {
        $('#messages').append($('<li class="list-group-item"></li>').text(text));
    }

    $('#btnConnect').on('click', function () {
        const socket = new SockJS(wsEndpoint);
        stompClient = Stomp.over(socket);
        stompClient.connect({}, function () {
            appendMessage('Connected.');
            $('#btnSend').prop('disabled', false);
            stompClient.subscribe('/topic/messages', function (frame) {
                const body = JSON.parse(frame.body);
                appendMessage(body.sender + ': ' + body.content);
            });
        }, function (error) {
            appendMessage('Connection error: ' + error);
        });
    });

    $('#btnSend').on('click', function () {
        if (!stompClient) {
            return;
        }
        stompClient.send('/app/chat.send', {}, JSON.stringify({
            sender: $('#sender').val() || 'Guest',
            content: $('#content').val() || '',
            type: 'CHAT'
        }));
        $('#content').val('');
    });

    $('#content').on('keyup', function (e) {
        if (e.key === 'Enter') {
            $('#btnSend').click();
        }
    });
</script>
</body>
</html>
