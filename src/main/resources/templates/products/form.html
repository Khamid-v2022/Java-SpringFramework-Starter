<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head(${pageTitle})}"></head>
<body>
<div th:replace="~{layout :: nav}"></div>

<main class="container mb-5">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <h1 class="h3 mb-3" th:text="${pageTitle}">Product Form</h1>
            <form th:action="@{${formAction}}" th:object="${productForm}" method="post" class="card card-body shadow-sm">
                <div class="mb-3">
                    <label class="form-label" for="name">Name</label>
                    <input id="name" class="form-control" th:field="*{name}" th:classappend="${#fields.hasErrors('name')} ? ' is-invalid'"/>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="description">Description</label>
                    <textarea id="description" class="form-control" rows="3" th:field="*{description}"
                              th:classappend="${#fields.hasErrors('description')} ? ' is-invalid'"></textarea>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label" for="price">Price</label>
                        <input id="price" type="number" step="0.01" min="0" class="form-control" th:field="*{price}"
                               th:classappend="${#fields.hasErrors('price')} ? ' is-invalid'"/>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label" for="quantity">Quantity</label>
                        <input id="quantity" type="number" min="0" class="form-control" th:field="*{quantity}"
                               th:classappend="${#fields.hasErrors('quantity')} ? ' is-invalid'"/>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('quantity')}" th:errors="*{quantity}"></div>
                    </div>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Save</button>
                    <a class="btn btn-outline-secondary" th:href="@{/products}">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</main>

<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
