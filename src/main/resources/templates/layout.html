<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${title} + ' | Spring Starter'">Spring Starter</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/webjars/font-awesome/6.5.1/css/all.min.css}"/>
    <link rel="stylesheet" th:href="@{/webjars/datatables.net-bs5/2.3.8/css/dataTables.bootstrap5.min.css}"/>
    <link rel="stylesheet" th:href="@{/static/css/app.css}"/>
</head>
<body>
<nav th:fragment="nav" class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/products}">Spring Starter</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain"
                aria-controls="navMain" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMain">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/products}">Products CRUD</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/api-demo}">REST API Demo</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/websocket}">WebSocket Chat</a></li>
            </ul>
            <span class="navbar-text text-secondary small">Spring Framework 7 + Hibernate</span>
        </div>
    </div>
</nav>

<div th:fragment="scripts">
    <script th:src="@{/webjars/jquery/3.7.1/jquery.min.js}"></script>
    <script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/webjars/datatables.net/2.3.8/js/dataTables.min.js}"></script>
    <script th:src="@{/webjars/datatables.net-bs5/2.3.8/js/dataTables.bootstrap5.min.js}"></script>
</div>
</body>
</html>
