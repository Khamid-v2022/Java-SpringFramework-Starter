<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head(${pageTitle})}"></head>
<body>
<div th:replace="~{layout :: nav}"></div>

<main class="container mb-5">
    <h1 class="h3 mb-1">REST API Demo</h1>
    <p class="text-muted">Calls <code>/api/products</code> with jQuery (JSON).</p>

    <div class="row g-3">
        <div class="col-lg-5">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h2 class="h5">Create via REST</h2>
                    <div class="mb-2">
                        <label class="form-label">Name</label>
                        <input id="apiName" class="form-control" value="API Sample Item"/>
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Description</label>
                        <input id="apiDesc" class="form-control" value="Created from REST demo page"/>
                    </div>
                    <div class="row">
                        <div class="col-6 mb-2">
                            <label class="form-label">Price</label>
                            <input id="apiPrice" type="number" step="0.01" class="form-control" value="9.99"/>
                        </div>
                        <div class="col-6 mb-2">
                            <label class="form-label">Qty</label>
                            <input id="apiQty" type="number" class="form-control" value="5"/>
                        </div>
                    </div>
                    <button id="btnCreate" type="button" class="btn btn-primary">POST /api/products</button>
                    <button id="btnReload" type="button" class="btn btn-outline-secondary">GET /api/products</button>
                </div>
            </div>
        </div>
        <div class="col-lg-7">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h2 class="h5">Response</h2>
                    <pre id="apiOutput" class="bg-light border rounded p-3 small mb-0" style="min-height: 280px;">Click a button...</pre>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{layout :: scripts}"></div>
<script th:inline="javascript">
    const apiBase = /*[[@{/api/products}]]*/ '/api/products';

    function show(data) {
        $('#apiOutput').text(typeof data === 'string' ? data : JSON.stringify(data, null, 2));
    }

    $('#btnReload').on('click', function () {
        $.getJSON(apiBase)
            .done(show)
            .fail(function (xhr) {
                show(xhr.responseText || xhr.statusText);
            });
    });

    $('#btnCreate').on('click', function () {
        $.ajax({
            url: apiBase,
            method: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({
                name: $('#apiName').val(),
                description: $('#apiDesc').val(),
                price: Number($('#apiPrice').val()),
                quantity: Number($('#apiQty').val())
            })
        }).done(function (data) {
            show(data);
            $('#btnReload').click();
        }).fail(function (xhr) {
            show(xhr.responseText || xhr.statusText);
        });
    });

    $('#btnReload').click();
</script>
</body>
</html>
