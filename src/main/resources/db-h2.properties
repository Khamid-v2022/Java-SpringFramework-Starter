# Offline / local demo (no Oracle required)
jdbc.driver=org.h2.Driver
jdbc.url=jdbc:h2:mem:springstarter;MODE=Oracle;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
jdbc.username=sa
jdbc.password=
jdbc.pool.size=5
hibernate.dialect=org.hibernate.dialect.H2Dialect
hibernate.hbm2ddl.auto=update
hibernate.show_sql=true
hibernate.format_sql=true
